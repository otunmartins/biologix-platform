# Explicit project name — avoids defaulting to the clone folder name (e.g. insulin-ai).
name: biologix-ai

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biologix
      POSTGRES_USER: biologix
      POSTGRES_PASSWORD: biologix
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biologix"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-biologix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-biologix-local-storage}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://biologix:biologix@postgres:5432/biologix
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      # An account whose login email is listed here can reach /admin.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      BIOLOGIX_AI_CORS_ORIGINS: http://localhost:3000
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: biologix-artifacts
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-biologix}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-biologix-local-storage}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SLIM: ${SLIM:-1}
    command: /app/scripts/start_worker.sh
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://biologix:biologix@postgres:5432/biologix
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET: biologix-artifacts
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-biologix}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-biologix-local-storage}
      SCIENTIFIC_RETROSYNTHESIS_ENABLED: ${SCIENTIFIC_RETROSYNTHESIS_ENABLED:-true}
      SCIENTIFIC_OPENMM_ENABLED: ${SCIENTIFIC_OPENMM_ENABLED:-true}
      SCIENTIFIC_OPENMM_NPT: ${SCIENTIFIC_OPENMM_NPT:-true}
      SCIENTIFIC_OPENMM_NPT_PS: ${SCIENTIFIC_OPENMM_NPT_PS:-200}
      SCIENTIFIC_OPENMM_WALL_CLOCK_S: ${SCIENTIFIC_OPENMM_WALL_CLOCK_S:-3600}
      SCIENTIFIC_OPENMM_MINIMIZE_ITERATIONS: ${SCIENTIFIC_OPENMM_MINIMIZE_ITERATIONS:-2000}
      SCIENTIFIC_OPENMM_MIN_FRAMES: ${SCIENTIFIC_OPENMM_MIN_FRAMES:-10}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      BIOLOGIX_LLM_MODEL: ${BIOLOGIX_LLM_MODEL:-claude-opus-5}
      BIOLOGIX_LLM_EFFORT: ${BIOLOGIX_LLM_EFFORT:-high}
      BIOLOGIX_RETRO_PLAN_ATTEMPTS: ${BIOLOGIX_RETRO_PLAN_ATTEMPTS:-2}
      EXPERIMENT_JOB_TIMEOUT_S: ${EXPERIMENT_JOB_TIMEOUT_S:-5400}
      BIOLOGIX_AI_OPENMM_PLATFORM: ${BIOLOGIX_AI_OPENMM_PLATFORM:-auto}
      BIOLOGIX_AI_OPENMM_MATRIX_FIXED_MODE: ${BIOLOGIX_AI_OPENMM_MATRIX_FIXED_MODE:-true}
      BIOLOGIX_AI_OPENMM_MATRIX_N_POLYMERS: ${BIOLOGIX_AI_OPENMM_MATRIX_N_POLYMERS:-8}
      BIOLOGIX_AI_OPENMM_MATRIX_BOX_NM: ${BIOLOGIX_AI_OPENMM_MATRIX_BOX_NM:-0}
      BIOLOGIX_AI_OPENMM_CANDIDATE_TIMEOUT_S: ${BIOLOGIX_AI_OPENMM_CANDIDATE_TIMEOUT_S:-240}
      BIOLOGIX_AIZYNTH_TIMEOUT: ${BIOLOGIX_AIZYNTH_TIMEOUT:-360}
      BIOLOGIX_PLATFORM_RUNS_DIR: /app/runs/platform
      STALE_JOB_MINUTES: ${STALE_JOB_MINUTES:-45}
    deploy:
      replicas: ${WORKER_REPLICAS:-1}
    volumes:
      - ./runs:/app/runs
      - ./data:/app/data
      - opencode-auth:/root/.local/share/opencode
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: frontend
      args:
        API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  biologix:
    build:
      context: .
      dockerfile: Dockerfile
      # ambertools and several other conda-forge packages have no linux/aarch64
      # builds.  Force amd64 so the image works on both Apple Silicon (via
      # Rosetta 2) and any x86 Linux host.
      platforms:
        - linux/amd64
      args:
        # Set SLIM=1 to build a smaller image that downloads models on first run
        SLIM: ${SLIM:-0}
        OPENCODE_VERSION: ${OPENCODE_VERSION:-1.17.4}
    image: biologix-ai:local
    init: true         # tini as PID 1 — better signal forwarding for the OpenCode TUI
    stdin_open: true   # keeps STDIN open for the TUI
    tty: true          # allocates a TTY (required for OpenCode TUI)
    env_file:
      # Copy .env.example → .env and fill in your LLM key before running.
      # Missing file is silently ignored so direct -e flags still work.
      - path: .env
        required: false
    environment:
      # Conda libstdc++ (GLIBCXX_3.4.29+) — required by RetroSynAgent/libLerc in treeBuilder
      - LD_LIBRARY_PATH=/opt/conda/envs/biologix-ai-sim/lib
      # Avoid mid-pipeline OpenMM Yes/No prompts (OpenCode TUI can freeze in Docker)
      - BIOLOGIX_AI_OPENMM_AUTO=${BIOLOGIX_AI_OPENMM_AUTO:-yes}
      # Pin OpenMM CPU thread count to 1.  Without this, OpenMM probes available
      # cores via sched_getaffinity which is broken under Rosetta 2 (linux/amd64
      # containers on Apple Silicon).  The broken probe causes the FFTW thread-pool
      # to deadlock on initialisation — the random hang you see at session start or
      # mid-simulation.  Single-threaded is slower but deterministic.
      - OPENMM_CPU_THREADS=1
      # Skip 1–1.5 GB ZINC HDF5 load during tree build (Rosetta Docker stability)
      - BIOLOGIX_SKIP_ZINC_BRIDGE=${BIOLOGIX_SKIP_ZINC_BRIDGE:-1}
      # MCP tool wall-clock caps (seconds) — return before OpenCode transport timeout
      - BIOLOGIX_AI_MCP_RETRO_TIMEOUT_S=${BIOLOGIX_AI_MCP_RETRO_TIMEOUT_S:-360}
      - BIOLOGIX_AI_MCP_ADMET_TIMEOUT_S=${BIOLOGIX_AI_MCP_ADMET_TIMEOUT_S:-90}
      - BIOLOGIX_AI_MCP_ADMET_BATCH_TIMEOUT_S=${BIOLOGIX_AI_MCP_ADMET_BATCH_TIMEOUT_S:-180}
      - BIOLOGIX_AI_MCP_MINE_TIMEOUT_S=${BIOLOGIX_AI_MCP_MINE_TIMEOUT_S:-120}
      - BIOLOGIX_AI_MCP_INDEX_TIMEOUT_S=${BIOLOGIX_AI_MCP_INDEX_TIMEOUT_S:-600}
      # Retrosynthesis subprocess wall clocks (PDF download, KG tree, AiZynthFinder)
      - BIOLOGIX_PDF_TIMEOUT=${BIOLOGIX_PDF_TIMEOUT:-60}
      - BIOLOGIX_TREE_TIMEOUT=${BIOLOGIX_TREE_TIMEOUT:-300}
      - BIOLOGIX_AIZYNTH_TIMEOUT=${BIOLOGIX_AIZYNTH_TIMEOUT:-360}
      # Pass through provider keys from host env if not already in .env
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - ASTA_API_KEY=${ASTA_API_KEY:-}
    volumes:
      # Session outputs persisted to the host so nothing is lost on container exit
      - ./runs:/app/runs
      # Papers / PDFs used by mine_literature
      - ./papers:/app/papers
      # OpenCode auth state (opencode auth login) persisted across runs
      - opencode-auth:/root/.local/share/opencode
      # Retrosynthesis + AiZynth data (precursor DB, Molport cache, models)
      - biologix-data:/app/data

volumes:
  postgres-data:
  redis-data:
  minio-data:
  opencode-auth:
  biologix-data:
