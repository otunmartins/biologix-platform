name: Modal GPU configuration checks
on:
  pull_request:
    paths:
      - modal_app.py
      - tests/test_modal_gpu_configuration.py
      - .github/workflows/test-modal-gpu-configuration.yml
  workflow_dispatch:
jobs:
  test-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pytest
        run: python -m pip install pytest
      - name: Check Python syntax
        run: python -m py_compile modal_app.py tests/test_modal_gpu_configuration.py
      - name: Run GPU routing regression tests
        run: python -m pytest -q tests/test_modal_gpu_configuration.py
